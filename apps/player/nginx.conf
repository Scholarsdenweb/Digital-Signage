server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Redirect root to the player path
  location = / {
    return 302 /player/;
  }

  # Player SPA served under /player/
  location /player/ {
    try_files $uri $uri/ /player/index.html;
  }

  # Service worker must be served from the /player/ scope with no long cache
  location = /player/sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
